<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c1c1c">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />

<script src="https://cdn.jsdelivr.net/npm/ios-pwa-splash@1.0.0/cdn.min.js"></script>
<script>iosPWASplash('icons/icon-192.png', '#01161e');</script>

<title>Login</title>

<style>
:root{
    --bg:#01161e;
    --surface:#0b2730;
    --surface-2:#0f313b;
    --text:#eff6e0;
    --muted:rgba(239,246,224,0.65);
    --primary:#598392;
    --danger:#ef4444;
    --border:rgba(174,195,176,0.12);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color: transparent;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    touch-action:manipulation;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
    background:var(--bg);
    color:var(--text);
}

body{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
}

#loginBox{
    width:100%;
    max-width:340px;
    text-align:center;
    padding:20px;
}

h2{
    margin:0 0 25px;
    font-size:16px;
}

#pinDisplay{
    display:flex;
    justify-content:center;
    gap:14px;
    margin-bottom:30px;
}

.dot{
    width:14px;
    height:14px;
    border-radius:50%;
    border:1px solid var(--border);
    background:transparent;
    transition:0.2s;
}

.dot.filled{
    background:var(--primary);
    border-color:var(--primary);
    transform:scale(1.15);
}

#error{
    height:18px;
    font-size:12px;
    color:var(--danger);
    opacity:0;
    transition:0.2s;
}

#error.show{
    opacity:1;
}

#keypad{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:12px;
    margin-top:10px;
}

.pinBtn{
    aspect-ratio:1 / 1;
    border-radius:14px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text);
    font-size:18px;
    box-shadow:0 6px 18px rgba(0,0,0,0.25);

    cursor:pointer;
    transition:0.08s ease;
}

.pinBtn:active{
    transform:scale(0.94);
    background:rgba(89,131,146,0.25);
}

.shake{
    animation:shake 0.25s ease;
}

@keyframes shake{
    0%{transform:translateX(0)}
    25%{transform:translateX(-6px)}
    50%{transform:translateX(6px)}
    75%{transform:translateX(-4px)}
    100%{transform:translateX(0)}
}
</style>
</head>

<body>

<div id="loginBox">

    <h2>Wprowadź PIN</h2>

    <div id="pinDisplay">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

    <div id="error">Nieprawidłowy PIN</div>

    <div id="keypad">
        <button class="pinBtn">1</button>
        <button class="pinBtn">2</button>
        <button class="pinBtn">3</button>
        <button class="pinBtn">4</button>
        <button class="pinBtn">5</button>
        <button class="pinBtn">6</button>
        <button class="pinBtn">7</button>
        <button class="pinBtn">8</button>
        <button class="pinBtn">9</button>
        <button class="pinBtn">C</button>
        <button class="pinBtn">0</button>
        <button class="pinBtn" style="visibility:hidden"></button>
    </div>

</div>

<script>
const CORRECT_PIN = "1991";
let pin = "";

const dots = document.querySelectorAll(".dot");
const error = document.getElementById("error");
const box = document.getElementById("loginBox");

function update(){
    dots.forEach((d,i)=>{
        d.classList.toggle("filled", i < pin.length);
    });
}

function showError(){
    error.classList.add("show");

    box.classList.remove("shake");
    void box.offsetWidth;
    box.classList.add("shake");

    if(navigator.vibrate){
        navigator.vibrate(80);
    }

    setTimeout(()=> error.classList.remove("show"), 1200);
}

function check(){
    if(pin === CORRECT_PIN){
        sessionStorage.setItem("auth","1");
        location.replace("index.html");
    }else{
        showError();
        pin = "";
        update();
    }
}

/* 🔥 NAJWAŻNIEJSZA ZMIANA: pointerdown zamiast click */
document.querySelectorAll(".pinBtn").forEach(btn=>{
    btn.addEventListener("pointerdown", (e)=>{

        const v = btn.textContent;

        if(v === "C"){
            pin = "";
            update();
            return;
        }

        if(pin.length < 4){
            pin += v;
            update();

            if(pin.length === 4){
                setTimeout(check, 80);
            }
        }
    });
});

update();
</script>

</body>
</html>
