<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f5f7fb">

<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />

<title>Historia Nawadniania</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />

<!-- ================= NO FLASH AUTH ================= -->
<style>
html { display:none; }
</style>

<script>
if (sessionStorage.getItem("auth") !== "1") {
    location.replace("login.html");
} else {
    document.documentElement.style.display = "block";
}
</script>

<style>
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#1e1e1e;
  --muted:#6b7280;
  --primary:#4f46e5;
  --water:#3b82f6;
  --shadow:0 10px 30px rgba(0,0,0,0.08);
}

/* ================= GLOBAL ================= */
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:f5f7fb;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  color:var(--text);
}

.container{
  max-width:520px;
  margin:auto;
  padding:10px;
  padding-bottom:90px;
}

/* ================= TITLE ================= */
.appTitle{
  text-align:center;
  font-size:1.1rem;
  font-weight:700;
  margin:30px 0 20px;
}

/* ================= CARD ================= */
.calendarCard,
.eventsCard{
  background:var(--card);
  border-radius:18px;
  box-shadow:var(--shadow);
  padding:16px;
  margin-bottom:12px;
}

/* ================= HEADER ================= */
.calendarHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.calendarTitle{
  font-size:0.95rem;
  font-weight:700;
}

.navBtn{
  width:38px;
  height:38px;
  border:none;
  border-radius:12px;
  background:#eef2ff;
  color:var(--primary);
  cursor:pointer;
}

/* ================= WEEKDAYS ================= */
.weekdays{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  margin-bottom:6px;
}

.weekdays div{
  text-align:center;
  font-size:10px;
  color:var(--muted);
  font-weight:600;
}

/* ================= DAYS ================= */
.days{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
}

.day{
  aspect-ratio:1;
  border-radius:12px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  transition:.15s;
  font-size:12px;
  background:#f3f4f6;
}

.day:hover{
  background:#e5e7eb;
}

.day.today{
  background:#eef2ff;
  color:var(--primary);
  font-weight:700;
}

.day.selected{
  background:var(--primary);
  color:#fff;
}

.day.empty{
  pointer-events:none;
  background:transparent;
}

.dayNumber{
  font-size:12px;
}

/* dot */
.dot{
  width:5px;
  height:5px;
  border-radius:50%;
  background:var(--water);
  margin-top:3px;
}

/* ================= EVENTS ================= */
.eventsTitle{
  font-size:0.9rem;
  font-weight:700;
  margin-bottom:10px;
}

.eventItem{
  display:flex;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid #f1f5f9;
}

.eventItem:last-child{
  border-bottom:none;
}

.eventIcon{
  width:36px;
  height:36px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.eventName{
  font-size:0.85rem;
  font-weight:600;
}

.eventTime{
  font-size:11px;
  color:var(--muted);
}

/* ================= EMPTY ================= */
.noEvents{
  text-align:center;
  font-size:12px;
  color:var(--muted);
  padding:20px 0;
}

/* ================= LOADER ================= */
.loader {
  border:6px solid #f3f3f3;
  border-top:6px solid var(--primary);
  border-radius:50%;
  width:50px;
  height:50px;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  0%{transform:rotate(0)}
  100%{transform:rotate(360deg)}
}


    /* ================= NAVIGATION ================= */
    .bottomNav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 72px;
      background: #fff;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
      z-index: 9999;
    }

    .navItem {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-decoration: none;
      color: #94a3b8;
      font-size: 11px;
      gap: 4px;
    }

    .navItem i { font-size: 20px; }
    .navItem.active { color: #111827; }

/* ================= BUTTON (nav inside calendar) ================= */
button{
  font-size:14px;
}
</style>
</head>
<body>


<!-- LOADING SCREEN -->
<div id="loadingScreen" style="
    position: fixed;
    inset: 0;
    background: white;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10000;
    flex-direction: column;
">
    <div class="loader"></div>
    <div style="margin-top:20px; font-size:16px; color:#888;">
        Ładowanie...
    </div>
</div>


<div class="container">

    <div class="appTitle">
        Historia Nawadniania
    </div>

    <div class="calendarCard">

        <div class="calendarHeader">
            <button class="navBtn" onclick="changeMonth(-1)">
                <i class="fa-solid fa-chevron-left"></i>
            </button>

            <div class="calendarTitle" id="monthTitle"></div>

            <button class="navBtn" onclick="changeMonth(1)">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>

        <div class="weekdays">
            <div>Pn</div>
            <div>Wt</div>
            <div>Śr</div>
            <div>Cz</div>
            <div>Pt</div>
            <div>So</div>
            <div>Nd</div>
        </div>

        <div class="days" id="calendarDays"></div>

    </div>

    <div class="eventsCard">
        <div class="eventsTitle" id="selectedDateTitle">
            Wybierz dzień
        </div>

        <div id="eventsList"></div>
    </div>

</div>

<div class="bottomNav">

    <a href="./" class="navItem ">
        <i class="fa-solid fa-house"></i>
        <span>Start</span>
    </a>

    <a href="./historia.html" class="navItem active">
        <i class="fa-solid fa-clock-rotate-left"></i>
        <span>Historia</span>
    </a>


</div>

<script>
let lastTouchEnd = 0;

// blokada pinch zoom
document.addEventListener('touchstart', function (e) {
  if (e.touches.length > 1) {
    e.preventDefault();
  }
}, { passive: false });

// blokada double tap zoom
document.addEventListener('touchend', function (e) {
  const now = Date.now();

  if (now - lastTouchEnd <= 300) {
    e.preventDefault();
  }

  lastTouchEnd = now;
}, { passive: false });
</script>


<script>

const API = "https://raspy-fire-23a7.piotrgorajewski.workers.dev";
const TOKEN = "MOJ_SUPER_TOKEN_123456";

let events = {};
let zonesMap = {};
let selectedDateKey = null;

const realToday = new Date();

const monthNames = [
    "Styczeń","Luty","Marzec","Kwiecień",
    "Maj","Czerwiec","Lipiec","Sierpień",
    "Wrzesień","Październik","Listopad","Grudzień"
];

let currentDate = new Date();


// ========================
// COLORS
// ========================
function getZoneColor(zone) {

    const colors = [
        "#22c55e",
        "#3b82f6",
        "#f59e0b",
        "#ef4444",
        "#a855f7",
        "#06b6d4",
        "#84cc16",
        "#f97316"
    ];

    return colors[(zone - 1) % colors.length];
}


// ========================
// TIME
// ========================
function getMinutes(start, end) {
    return Math.max(1, Math.round((end - start) / 60000));
}


// ========================
// BUILD SESSIONS (ON/OFF)
// ========================
function buildSessions(logs) {

    const sessions = {};

    logs.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

    logs.forEach(log => {

        const zone = log.zone;
        const time = new Date(log.created_at);

        if (!sessions[zone]) sessions[zone] = [];

        const last = sessions[zone][sessions[zone].length - 1];

        if (log.state === true) {
            sessions[zone].push({
                start: time,
                end: null
            });
        }

        if (log.state === false && last && last.end === null) {
            last.end = time;
        }
    });

    return sessions;
}


// ========================
// LOAD ZONES
// ========================
async function loadZones() {

    const res = await fetch(`${API}/api/state`, {
        headers: {
            Authorization: `Bearer ${TOKEN}`
        }
    });

    const data = await res.json();

    zonesMap = {};

    (data.zones || []).forEach(z => {
        zonesMap[z.zone] = z.name || "Brak nazwy";
    });
}


// ========================
// FORMAT ZONE
// ========================
function formatZone(zoneIndex) {

    const name = zonesMap[zoneIndex];

    return name
        ? `Sekcja ${zoneIndex} (${name})`
        : `Sekcja ${zoneIndex} (Nieznana strefa)`;
}


// ========================
// LOAD HISTORY
// ========================
async function loadHistory() {

    try {

        await loadZones();

        const response = await fetch(
            `${API}/api/valve-log?token=${encodeURIComponent(TOKEN)}`
        );

        const logs = await response.json();

        const sessionsByZone = buildSessions(logs);

        events = {};

Object.keys(sessionsByZone).forEach(zone => {

    sessionsByZone[zone].forEach(session => {

        if (!session.start) return;

        const isRunning = !session.end;

        const endTime = isRunning
            ? new Date()
            : session.end;

        const dateKey = session.start.toISOString().substring(0, 10);

        if (!events[dateKey]) events[dateKey] = [];

        const minutes = getMinutes(session.start, endTime);

        events[dateKey].push({
            zone: parseInt(zone),
            name: formatZone(parseInt(zone)),
            time: session.start.toLocaleTimeString("pl-PL", {
                hour: "2-digit",
                minute: "2-digit"
            }),
            duration: minutes,
            running: isRunning
        });
    });
});

        renderCalendar();

    } catch (err) {
        console.error(err);
    } finally {

        const loader = document.getElementById("loadingScreen");

        if (loader) {
            loader.style.opacity = "0";
            setTimeout(() => loader.style.display = "none", 400);
        }
    }
}


// ========================
// CALENDAR
// ========================
function renderCalendar() {

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById("monthTitle").innerText =
        `${monthNames[month]} ${year}`;

    const container = document.getElementById("calendarDays");
    container.innerHTML = "";

    let firstDay = new Date(year, month, 1).getDay();
    firstDay = firstDay === 0 ? 6 : firstDay - 1;

    const daysInMonth = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement("div");
        empty.className = "day empty";
        container.appendChild(empty);
    }

    for (let day = 1; day <= daysInMonth; day++) {

        const dateKey =
            `${year}-${String(month + 1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;

        const cell = document.createElement("div");
        cell.className = "day";

        const isToday =
            day === realToday.getDate() &&
            month === realToday.getMonth() &&
            year === realToday.getFullYear();

        if (isToday) cell.classList.add("today");

        const hasEvents = events[dateKey]?.length > 0;

        cell.innerHTML = `
            <div class="dayNumber">${day}</div>
            ${hasEvents ? '<div class="dot"></div>' : ''}
        `;

        cell.onclick = () => selectDate(dateKey, cell);

        container.appendChild(cell);
    }

    // auto-select tylko w aktualnym miesiącu
    const isCurrentMonth =
        currentDate.getFullYear() === realToday.getFullYear() &&
        currentDate.getMonth() === realToday.getMonth();

    if (isCurrentMonth) {

        const dateKey =
            `${realToday.getFullYear()}-${String(realToday.getMonth()+1).padStart(2,'0')}-${String(realToday.getDate()).padStart(2,'0')}`;

        const todayCell = document.querySelector(".today");

        if (todayCell) selectDate(dateKey, todayCell);
    }
}


// ========================
// SELECT DATE
// ========================
function selectDate(dateKey, element) {

    selectedDateKey = dateKey;

    document.querySelectorAll(".day.selected")
        .forEach(el => el.classList.remove("selected"));

    element.classList.add("selected");

    const list = document.getElementById("eventsList");

    const date = new Date(dateKey);

    document.getElementById("selectedDateTitle").innerText =
        date.toLocaleDateString("pl-PL", {
            day: "numeric",
            month: "long",
            year: "numeric"
        });

    if (!events[dateKey]?.length) {
        list.innerHTML = `<div class="noEvents">Brak zdarzeń</div>`;
        return;
    }

    list.innerHTML = "";

    events[dateKey].forEach(ev => {

        const color = getZoneColor(ev.zone);

        list.innerHTML += `
            <div class="eventItem">

                <div class="eventIcon" style="background:${color}22;color:${color}">
                    <i class="fa-solid fa-droplet"></i>
                </div>

                <div class="eventInfo">

                    <div class="eventName">${ev.name}</div>

<div class="eventTime">
    ${ev.time} • ${ev.duration} min
    ${ev.running
        ? ' • <span style="color:#22c55e;font-weight:600">TRWA PODLEWANIE</span>'
        : ''
    }
</div>

                </div>

            </div>
        `;
    });
}


// ========================
// MONTH SWITCH
// ========================
function changeMonth(dir) {
    currentDate.setMonth(currentDate.getMonth() + dir);
    renderCalendar();
}


// ========================
// START
// ========================
loadHistory();

</script>



<script>
window.addEventListener('load', () => {

    const loader =
        document.getElementById('loadingScreen');

    loader.style.transition = 'opacity 1s';
    loader.style.opacity = '0';

    setTimeout(() => {
        loader.style.display = 'none';
    }, 500);

});

</script>
</body>
</html>
