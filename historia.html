<!DOCTYPE html>
<html lang="pl">
<head>
   <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <link rel="manifest" href="manifest.json" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">

  <title>ESP32 Dashboard</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />

  <!-- FullCalendar CSS -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet" />
  <!-- FullCalendar JS -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<style>
:root {
  --bg: #f5f7fb;
  --card: #ffffff;
  --text: #1e1e1e;
  --muted: #6b7280;
  --primary: #4f46e5;
  --danger: #ef4444;
  --shadow: 0 10px 30px rgba(0,0,0,0.08);
}

html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  background: var(--bg);
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  color: var(--text);
  overflow-x: hidden;
}

* { box-sizing: border-box; min-width: 0; }
img, svg { max-width: 100%; }

.container {
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
  padding: 10px;
  padding-bottom: 90px;
}

/* APP TITLE */
.appTitle {
  font-size: 24px;
  font-weight: bold;
  color: #888888;
  text-align: center;
  margin: -20px 0 10px 0;
}

/* LOADING SCREEN */
.loader {
  border: 6px solid #f3f3f3;
  border-top: 6px solid var(--primary);
  border-radius: 50%;
  width: 60px;
  height: 60px;
  animation: spin 1s linear infinite;
}
@keyframes spin {
  0% { transform: rotate(0deg);}
  100% { transform: rotate(360deg);}
}

/* CALENDAR */
#calendar {
  width: 100%;
  min-height: 400px; /* minimalna wysokość */
  background: white;
  border-radius: 18px;
  padding: 10px;
  box-shadow: var(--shadow);
}

/* TOP BAR */
.topBar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 10px;
  height: auto;
  background: var(--bg);
  gap: 10px;
  margin-bottom: 30px;
}

.notifBtn {
  position: absolute;
  top: 5px;
  right: 15px;
  width: 46px;
  height: 46px;
  border: none;
  background: white;
  color: #475569;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  cursor: pointer;
}
.notifBtn i { pointer-events: none; }

/* BOTTOM NAV */
.bottomNav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  height: 72px;
  background: #fff;
  display: flex;
  justify-content: space-around;
  align-items: center;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
  z-index: 9999;
}
.navItem {
  flex: 1;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-decoration: none;
  color: #94a3b8;
  font-size: 11px;
  gap: 4px;
}
.navItem i { font-size: 20px; }
.navItem.active { color: #111827; }

@media (max-width: 700px) { .container { max-width: 100%; } }
</style>
</head>
<body class="login">

<!-- LOADING SCREEN -->
<div id="loadingScreen" style="
    position: fixed;
    inset: 0;
    background: white;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10000;
    flex-direction: column;
">
    <div class="loader"></div>
    <div style="margin-top:20px; font-size:16px; color:#888;">Ładowanie...</div>
</div>

<div class="topBar">
    <button class="notifBtn">
        <i class="fa-regular fa-bell"></i>
    </button>
</div>

<div class="container">
    <div class="appTitle">
        Historia Nawadniania
    </div>

    <!-- KALENDARZ -->
    <div id="calendar"></div>
</div>

<div class="bottomNav">
    <a href="./" class="navItem">
        <i class="fa-solid fa-house"></i>
        <span>Start</span>
    </a>
    <a href="./historia.html" class="navItem active">
        <i class="fa-solid fa-clock-rotate-left"></i>
        <span>Historia</span>
    </a>
    <a href="./ustawienia.html" class="navItem">
        <i class="fa-solid fa-gear"></i>
        <span>Ustawienia</span>
    </a>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  var calendarEl = document.getElementById('calendar');

  var calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: 'dayGridMonth',
    headerToolbar: {
      left: 'prev,next today',
      center: 'title',
      right: 'dayGridMonth,timeGridWeek'
    },
    events: [
      { title: 'Podlewanie strefy 1', start: '2026-06-10T09:00', color: '#3b82f6' },
      { title: 'Podlewanie strefy 2', start: '2026-06-11T14:00', color: '#3b82f6' },
      { title: 'Podlewanie strefy 3', start: '2026-06-12T08:30', color: '#3b82f6' }
    ],
    themeSystem: 'standard',
    height: 'auto',
    displayEventTime: false, // tylko kropki
    dayMaxEvents: true
  });

  calendar.render();
});

window.addEventListener('load', () => {
    const loader = document.getElementById('loadingScreen');
    loader.style.transition = 'opacity 0.5s';
    loader.style.opacity = '0';
    setTimeout(() => loader.style.display = 'none', 500);
});
</script>
</body>
</html>
