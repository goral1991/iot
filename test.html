<!DOCTYPE html>
<html lang="pl">

<head>
<meta charset="UTF-8">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c1c1c">

<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>PWA TEST</title>

<style>

/* 🔥 KLUCZ: natychmiastowe tło (FIRST FRAME SAFE) */
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #1c1c1c;
  font-family: -apple-system, BlinkMacSystemFont, Arial;
}

/* 🔥 iOS SAFE AREA FIX (ważne przy translucent) */
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: env(safe-area-inset-top);
  background: #1c1c1c;
  z-index: 9999;
}

/* CENTER TEXT */
.center {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 22px;
  font-weight: 600;
}

</style>
</head>

<body>

<div class="center">
  SYSTEM NAWADNIANIA TEST
</div>

</body>
</html>
