<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 LED</title>

<style>

body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.card{
  text-align:center;
  width:90%;
  max-width:300px;
}

button{
  width:100%;
  height:120px;
  border:none;
  border-radius:20px;
  font-size:22px;
  cursor:pointer;
  transition:0.2s;
}

.on{
  background:#00c853;
  color:white;
}

.off{
  background:#d50000;
  color:white;
}

.loading{
  opacity:0.6;
}

.status{
  margin-top:15px;
  font-size:14px;
  opacity:0.7;
}

</style>
</head>

<body>

<div class="card">
  <button id="btn" class="off" onclick="toggleLed()">
    ŁADOWANIE...
  </button>

  <div class="status" id="status">Łączenie...</div>
</div>

<script>

const API = "https://raspy-fire-23a7.piotrgorajewski.workers.dev";
const TOKEN = "MOJ_SUPER_TOKEN_123456";

let ledState = false;
let loading = false;

async function fetchState(){

  try {
    const res = await fetch(API + "/api/state", {
      headers: {
        "Authorization": "Bearer " + TOKEN
      }
    });

    const data = await res.json();

    ledState = data.led;
    updateUI();

  } catch (e) {
    document.getElementById("status").innerText = "Błąd połączenia";
  }
}

async function toggleLed(){

  if(loading) return;

  loading = true;
  updateUI(true);

  try {

    const res = await fetch(API + "/api/command", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        token: TOKEN,
        led: !ledState
      })
    });

    const text = await res.text();
    console.log(text);

    await fetchState();

  } catch (e) {
    document.getElementById("status").innerText = "Błąd wysyłania";
  }

  loading = false;
  updateUI();
}

function updateUI(isLoading = false){

  const btn = document.getElementById("btn");
  const status = document.getElementById("status");

  btn.classList.remove("on","off","loading");

  if(isLoading){
    btn.classList.add("loading");
    btn.innerText = "PRZEŁĄCZANIE...";
    return;
  }

  if(ledState){
    btn.classList.add("on");
    btn.innerText = "WŁĄCZONY (kliknij aby wyłączyć)";
    status.innerText = "Stan: ON";
  } else {
    btn.classList.add("off");
    btn.innerText = "WYŁĄCZONY (kliknij aby włączyć)";
    status.innerText = "Stan: OFF";
  }
}

// start
fetchState();

// auto sync co 3s
setInterval(fetchState, 1000);

</script>

</body>
</html>
