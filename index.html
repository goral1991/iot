<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ESP32 Dashboard</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#1e1e1e;
  --muted:#6b7280;
  --primary:#4f46e5;
  --danger:#ef4444;
  --success:#22c55e;
  --shadow: 0 10px 30px rgba(0,0,0,0.08);
}

body{
  margin:0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
  background:var(--bg);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  color:var(--text);
}

.card{
  width:92%;
  max-width:420px;
  background:var(--card);
  border-radius:18px;
  box-shadow:var(--shadow);
  padding:22px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

h2{
  font-size:18px;
  margin:0;
}

.badge{
  font-size:12px;
  padding:6px 10px;
  border-radius:999px;
  background:#eef2ff;
  color:black;
  display:flex;
  align-items:center;
  justify-content:center;
  height:28px;
  line-height:1;
}

button{
  width:100%;
  border:none;
  border-radius:14px;
  padding:14px;
  font-size:15px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  transition:0.2s;
  margin-top:10px;
}

button:hover{
  transform:translateY(-1px);
}

button:active{
  transform:scale(0.98);
}

.primary{ background:var(--primary); color:white; }
.danger{ background:var(--danger); color:white; }
.gray{ background:#e5e7eb; color:#111; }

.status{
  margin-top:10px;
  font-size:13px;
  color:var(--muted);
}

.section{
  margin-top:18px;
  padding-top:16px;
  border-top:1px solid #eee;
}

.small{
  font-size:12px;
  color:var(--muted);
  margin-top:5px;
}

input[type=file]{
  margin-top:10px;
  width:100%;
}

[data-tooltip]{
  position:relative;
}

[data-tooltip]:hover::after{
  content:attr(data-tooltip);
  position:absolute;
  bottom:110%;
  left:50%;
  transform:translateX(-50%);
  background:#111;
  color:#fff;
  font-size:11px;
  padding:5px 8px;
  border-radius:6px;
  white-space:nowrap;
}
</style>
</head>

<body>

<div class="card">

  <div class="header">
    <h2><i class="fa-solid fa-microchip"></i> ESP32 Panel</h2>
    <div class="badge" id="fwInfo"></div>
  </div>

  <!-- Valve Control -->
  <button id="btn" class="gray" onclick="toggleValve()" data-tooltip="Kliknij aby zmienić stan zaworu">
    <i class="fa-solid fa-tap"></i> Ładowanie...
  </button>

  <div class="status" id="status">Łączenie z urządzeniem...</div>

  <!-- OTA -->
  <div class="section">
    <h3 style="margin:0;font-size:14px;">
      <i class="fa-solid fa-cloud-arrow-up"></i> OTA Update
    </h3>

    <input type="file" id="fw" accept=".bin"/>

    <button class="gray" onclick="uploadOTA()" data-tooltip="Upload firmware do serwera">
      <i class="fa-solid fa-upload"></i> Upload firmware
    </button>

    <button class="danger" onclick="flashOTA()" data-tooltip="Uruchom OTA na ESP32">
      <i class="fa-solid fa-bolt"></i> Flash ESP32
    </button>

    <div class="small">Wgraj plik .bin → Upload → Flash</div>
    <div class="status" id="otaStatus"></div>
  </div>

</div>

<script>
const API = "https://raspy-fire-23a7.piotrgorajewski.workers.dev";
const TOKEN = "MOJ_SUPER_TOKEN_123456";

let valveState = false;
let loading = false;
let lastState = null;

async function fetchState(){
  try{
    const res = await fetch(API + "/api/state", {
      headers: {"Authorization":"Bearer "+TOKEN}
    });
    const data = await res.json();

    if(!lastState || lastState.valve !== data.valve){
      valveState = data.valve;
      updateUI();
    }

    lastState = data;
    updateStatus(data);

  } catch(e){
    document.getElementById("status").innerText = "Brak połączenia z ESP32";
  }
}

async function toggleValve(){
  if(loading) return;

  loading = true;
  updateUI(true);

  try{
    await fetch(API + "/api/command", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        token:TOKEN,
        valve:!valveState
      })
    });

    await fetchState();
  } catch(e){
    document.getElementById("status").innerText = "Błąd zaworu";
  }

  loading = false;
  updateUI();
}

function updateUI(isLoading=false){
  const btn = document.getElementById("btn");
  const status = document.getElementById("status");

  btn.className = "";

  if(isLoading){
    btn.classList.add("gray");
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Przełączanie...';
    return;
  }

  if(valveState){
    btn.classList.add("primary");
    btn.innerHTML = '<i class="fa-solid fa-tap"></i> Zawór ON';
    status.innerText = "Stan: OTWARTY";
  } else {
    btn.classList.add("gray");
    btn.innerHTML = '<i class="fa-solid fa-tap"></i> Zawór OFF';
    status.innerText = "Stan: ZAMKNIĘTY";
  }
}

function updateStatus(data){
  const fwInfo = document.getElementById("fwInfo");
  if(!data) return;
  fwInfo.innerText = "FW: " + (data.version || "unknown");
}

async function uploadOTA(){
  const file = document.getElementById("fw").files[0];
  if(!file){
    document.getElementById("otaStatus").innerText = "Wybierz plik";
    return;
  }

  const form = new FormData();
  form.append("firmware", file);

  document.getElementById("otaStatus").innerText = "Uploading...";

  try{
    const res = await fetch(API + "/api/ota-upload", { method:"POST", body:form });
    if(!res.ok) throw new Error();
    document.getElementById("otaStatus").innerText = "Upload OK";
  } catch(e){
    document.getElementById("otaStatus").innerText = "Upload ERROR";
  }
}

async function flashOTA(){
  document.getElementById("otaStatus").innerText = "Sending OTA...";

  try{
    await fetch(API + "/api/command", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ token:TOKEN, ota:true })
    });

    document.getElementById("otaStatus").innerText = "OTA STARTED";
  } catch(e){
    document.getElementById("otaStatus").innerText = "OTA ERROR";
  }
}

// fetch valve state co 1s, sensor wysyłka co 10min może być w Arduino
fetchState();
setInterval(fetchState, 1000);
</script>

</body>
</html>
