const API = "https://raspy-fire-23a7.piotrgorajewski.workers.dev";

function rssiToPercent(rssi){

  if (rssi === undefined || rssi === null)
    return null;

  let percent = 2 * (rssi + 100);

  if (percent > 100) percent = 100;
  if (percent < 0) percent = 0;

  return Math.round(percent);
}


// ================= POWAIDOMIENIA =================

async function loadNotifications() {
  try {

    const res = await fetch(API + "/api/notifications?token=" + TOKEN);
    const data = await res.json();

    renderNotifications(data);

  } catch (e) {
    console.error("Notifications error:", e);
  }
}


function renderNotifications(data) {

  let unread = 0;

  const unreadList = [];
  const readList = [];

  data.forEach(n => {
    if (Number(n.is_read) === 0) {
      unreadList.push(n);
      unread++;
    } else {
      readList.push(n);
    }
  });

  // tylko 10 ostatnich przeczytanych
  const lastRead = readList.slice(0, 10);

  let html = `
    <div class="notifHeader">
      <button id="markAllRead">Oznacz wszystko jako przeczytane</button>
    </div>
  `;

  // ================= UNREAD =================
  if (unreadList.length > 0) {
    html += `<div class="notifSectionTitle">Nieprzeczytane</div>`;

    unreadList.forEach(n => {
      html += renderNotifItem(n, true);
    });
  }

  // ================= READ =================
  if (lastRead.length > 0) {
    html += `<div class="notifSectionTitle">Ostatnie</div>`;

    lastRead.forEach(n => {
      html += renderNotifItem(n, false);
    });
  }

  $("#notifDropdown").html(html);

  updateBadge(unread);
}

function renderNotifItem(n, isUnread) {

  const createdTime = new Date(n.created_at).toLocaleTimeString('pl-PL', {
    hour: '2-digit',
    minute: '2-digit'
  });
  

  return `
    <div class="notifItem ${isUnread ? 'unread' : 'read'}"
         data-id="${n.id}">

      <div class="notifContent">
        <div class="title">${n.title}</div>
        <div class="desc">Strefa ${n.zone_index} ${n.description || ""} ${createdTime}</div>
      </div>

      <div class="time">
        ${timeAgo(new Date(n.created_at))}
      </div>

    </div>
  `;
}

function updateBadge(unread) {

  if (unread > 9) {
    $('#notifBadge').text('9+').show();
  } else if (unread > 0) {
    $('#notifBadge').text(unread).show();
  } else {
    $('#notifBadge').hide();
  }
}

function timeAgo(date) {

  const now = new Date();
  const diff = now.getTime() - date.getTime();

  if (diff <= 0) return "teraz";

  const sec = Math.floor(diff / 1000);
  const min = Math.floor(sec / 60);
  const h = Math.floor(min / 60);
  const d = Math.floor(h / 24);

  if (sec < 60) return `${sec}s temu`;
  if (min < 60) return `${min}m temu`;
  if (h < 24) return `${h}h temu`;
  if (d < 7) return `${d}d temu`;

  return date.toLocaleDateString("pl-PL");
}

  // klik poza
  $(document).on('click', function () {
    $('#notifDropdown').removeClass('active');

  // klik powiadomienia → READ
  $(document).on('click', '.notifItem', function (e) {

  });

  // mark all read
  $(document).on('click', '#markAllRead', function (e) {
    e.stopPropagation();
    markAllRead();
  });

});

// ================= DAYS =================
document.addEventListener("DOMContentLoaded", () => {

  // ===== Dni tygodnia =====
  document.querySelectorAll(".harmonogram-day").forEach(el => {
    el.addEventListener("click", () => {
      const day = Number(el.dataset.day);

      if (selectedDays.includes(day)) {
        selectedDays = selectedDays.filter(d => d !== day);
        el.classList.remove("active");
      } else {
        selectedDays.push(day);
        el.classList.add("active");
      }
    });
  });

// ===== OLED MODE SWITCH =====
const oledToggle = document.getElementById("oledModeToggle");
if (oledToggle) {

  // ustaw stan switcha na podstawie fetchState
  // fetchState już aktualizuje switch, więc nie trzeba dodatkowego .then
  // tylko podpinamy event listener

  oledToggle.addEventListener("change", (e) => {
    toggleOLEDMode(e.target.checked);
  });

}

});

// ================= TIME =================
function toUTC(hour, minute){

  const d = new Date();

  d.setHours(hour, minute, 0, 0);

  return {
    hour: d.getUTCHours(),
    minute: d.getUTCMinutes()
  };
}

function toPL(hour, minute){

  const d = new Date();

  d.setUTCHours(hour, minute, 0, 0);

  return {
    hour: d.getHours(),
    minute: d.getMinutes()
  };
}

// ================= STATE =================

async function fetchState() {

  try {

    const res = await fetch(API + "/api/state", {
      headers: {
        "Authorization": "Bearer " + TOKEN
      }
    });

    const data = await res.json();

    zones = data.zones || [];

    // ================= FW =================
    document.getElementById("fwInfo").innerText =
      "FW: " + (data.fw_version || "unknown");
	  
	      // ================= NAME =================
    document.getElementById("fwName").innerText =
       (data.name || "unknown");

    // ================= ONLINE STATUS =================
    const dot = document.getElementById("onlineDot");
    const lastSeen = document.getElementById("lastSeenText");

    function timeAgo(date) {

      const now = new Date();
      const past = new Date(date);

      const diffSec = Math.floor((now - past) / 1000);

      if (diffSec < 60) return `${diffSec}s temu`;

      const diffMin = Math.floor(diffSec / 60);

      if (diffMin < 60) return `${diffMin} min temu`;

      const diffH = Math.floor(diffMin / 60);

      return `${diffH} h temu`;
    }

    const last = data.last_seen;

    let isOnline = false;

    if (last) {

      const diffSec = Math.floor((Date.now() - new Date(last)) / 1000);
      isOnline = diffSec <= 120;

      if (isOnline) {

        dot.classList.add("online");
        lastSeen.innerText = "online";

      } else {

        dot.classList.remove("online");
        lastSeen.innerText = `offline (${timeAgo(last)})`;
      }

    } else {

      dot.classList.remove("online");
      lastSeen.innerText = "• offline";
    }

    // ================= WIFI =================
const wifiIcon = document.getElementById("wifiIcon");
const wifiText = document.getElementById("wifiText");

let percent = null;

if (isOnline) {
  percent = rssiToPercent(data.wifi_rssi);
}

// OFFLINE
if (!isOnline) {

  wifiText.innerText = "n/a";

  wifiIcon.className = "fa-solid fa-wifi";
  wifiIcon.style.color = "#6b7280";
  wifiIcon.style.opacity = "0.4";
}

// ONLINE brak RSSI
else if (percent === null) {

  wifiText.innerText = "n/a";

  wifiIcon.className = "fa-solid fa-wifi";
  wifiIcon.style.color = "#9ca3af";
  wifiIcon.style.opacity = "0.6";
}

// ONLINE OK
else {

  wifiText.innerText = `${percent}%`;

  wifiIcon.className = "fa-solid fa-wifi";
  wifiIcon.style.opacity = "1";

  if (percent > 70) {
    wifiIcon.style.color = "#22c55e";
  } else if (percent > 40) {
    wifiIcon.style.color = "#f59e0b";
  } else {
    wifiIcon.style.color = "#ef4444";
  }
}

// ================= OLED MODE =================
const oledToggle = document.getElementById("oledModeToggle");
if (oledToggle) {
  oledToggle.checked = data.oled_mode ?? true; // synchronizacja z API
}

    // ================= UI =================
    updateUI();

  } catch (e) {

    document.getElementById("status").innerText =
      "Brak połączenia";
  }
}

// ================= EDIT ZONE NAME =================
async function editZoneName(zone, currentName) {

  const newName = prompt(
    `Nowa nazwa dla sekcji ${zone}:`,
    currentName || ""
  );

  if (newName === null)
    return;

  const res = await fetch(API + "/api/zone-name", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      token: TOKEN,
      zone: zone,
      name: newName.trim()
    })
  });

  const data = await res.json();

  if (!data.success) {

    alert("Błąd zapisu");

    return;
  }

  await loadZonesList();
  await fetchState();
  await loadSchedule();
}

// ================= OTA =================
function uploadOTA(){

  const file =
    document.getElementById("fw").files[0];

  if (!file)
    return alert("Wybierz plik");

  const form = new FormData();

  form.append("firmware", file);

  const btn =
    document.getElementById("uploadBtn");

  const status =
    document.getElementById("otaStatus");

  const wrap =
    document.getElementById("otaProgressWrap");

  const bar =
    document.getElementById("otaProgressBar");

  const text =
    document.getElementById("otaProgressText");

  // SHOW
  wrap.style.display = "block";

  bar.style.width = "0%";

  text.innerText = "0%";

  // BUTTON
  btn.disabled = true;

  btn.innerHTML = `
    <div class="spinner"></div>
    Uploading...
  `;

  status.innerText = "";

  const xhr = new XMLHttpRequest();

  xhr.open("POST", API + "/api/ota-upload");

  // PROGRESS
  xhr.upload.onprogress = (e) => {

    if(e.lengthComputable){

      const percent =
        Math.round((e.loaded / e.total) * 100);

      bar.style.width = percent + "%";

      text.innerText = percent + "%";
    }
  };

  // SUCCESS
  xhr.onload = () => {

    btn.disabled = false;

    btn.innerHTML = "Upload firmware";

    if(xhr.status === 200){

      status.innerText = "Upload OK";

      bar.style.width = "100%";

      text.innerText = "100%";

      // HIDE AFTER SUCCESS
      setTimeout(() => {

        wrap.style.display = "none";

        bar.style.width = "0%";

        text.innerText = "0%";

      }, 2000);

    }else{

      status.innerText = "Błąd uploadu";
    }
  };

  // ERROR
  xhr.onerror = () => {

    btn.disabled = false;

    btn.innerHTML = "Upload firmware";

    status.innerText = "Błąd połączenia";
  };

  xhr.send(form);
}

async function loadSchedule() {

  const res = await fetch(API + "/api/schedule?token=" + TOKEN);
  const data = await res.json();

  // CACHE GLOBALNY
  allSchedules = data;

  const days = [
    "Niedziela",
    "Poniedziałek",
    "Wtorek",
    "Środa",
    "Czwartek",
    "Piątek",
    "Sobota"
  ];

  // ================= SORT =================
  data.sort((a, b) => {

    if (a.zone_index !== b.zone_index) {
      return a.zone_index - b.zone_index;
    }

    if (a.weekday !== b.weekday) {
      return a.weekday - b.weekday;
    }

    const aTime = a.start_hour * 60 + a.start_minute;
    const bTime = b.start_hour * 60 + b.start_minute;

    return aTime - bTime;
  });

  let html = "";
  let currentZone = null;

  // ================= RENDER =================
  for (const s of data) {

    const pl = toPL(s.start_hour, s.start_minute);

    const zoneName =
      zoneMap?.[s.zone_index] || `Sekcja ${s.zone_index}`;

    // ===== START NOWEJ STREFY =====
    if (currentZone !== s.zone_index) {

      if (currentZone !== null) {
        html += `</div></div>`; // zamknięcie poprzedniej grupy
      }

      currentZone = s.zone_index;

      html += `
        <div class="zoneGroup">

          <div class="zoneHeader">
            <i class="fa-solid fa-layer-group"></i>
            ${zoneName}
          </div>

          <div class="zoneContent">
      `;
    }

    // ===== ROW =====
    html += `
      <div class="scheduleRow">

        <div class="scheduleMeta">

          <div class="scheduleDay">
            ${days[s.weekday]}
          </div>

          <div class="scheduleTime">
            ${String(pl.hour).padStart(2, '0')}:
            ${String(pl.minute).padStart(2, '0')}
            • ${Math.round(s.duration_sec / 60)} min
          </div>

        </div>

        <button class="danger smallBtn"
                onclick="deleteSchedule(${s.id})">

          <i class="fa fa-trash"></i>

        </button>

      </div>
    `;
  }

  // ================= ZAMKNIĘCIE OSTATNIEJ GRUPY =================
  if (currentZone !== null) {
    html += `</div></div>`;
  }

  // ================= EMPTY STATE =================
  document.getElementById("scheduleList").innerHTML =
    data.length
      ? html
      : `<div class="muted" style="padding:10px 0;">
           Brak harmonogramów
         </div>`;
}

// ================= ADD SCHEDULE =================
async function addSchedule() {

  const time = document.getElementById("time").value;
  const durationMin = Number(document.getElementById("duration").value);
  const zone = Number(document.getElementById("zoneSelect").value);

  if (!time) return alert("Wybierz godzinę");
  if (!durationMin) return alert("Podaj czas");
  if (selectedDays.length === 0) return alert("Wybierz dni");

  const [hour, minute] = time.split(":").map(Number);
  const utc = toUTC(hour, minute);

  const requests = selectedDays.map(day => {

    return fetch(API + "/api/schedule", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        token: TOKEN,
        weekday: day,
        start_hour: utc.hour,
        start_minute: utc.minute,
        duration_sec: durationMin * 60,
        zone_index: zone
      })
    });

  });

  await Promise.all(requests);

  // reset UI
  selectedDays = [];
  document.querySelectorAll(".day")
    .forEach(d => d.classList.remove("active"));

  document.getElementById("time").value = "";
  document.getElementById("duration").value = "";

  loadSchedule();
}

// ================= NASTEPNE PODLEWANIE =================
function getNextWateringForZone(schedules, zoneIndex) {

  const now = new Date();

  const nowDay = now.getDay(); // NIE UTC

  const nowSec =
    now.getUTCHours() * 3600 +
    now.getUTCMinutes() * 60 +
    now.getUTCSeconds();

  let best = null;

  for (const s of schedules) {

    if (!s.enabled) continue;
    if (Number(s.zone_index) !== Number(zoneIndex)) continue;

    for (let i = 0; i <= 7; i++) {

        const day = (nowDay + i) % 7;

      if (Number(s.weekday) !== day) continue;

      const startSec =
        Number(s.start_hour) * 3600 +
        Number(s.start_minute) * 60;

      if (i === 0 && startSec <= nowSec) continue;

      const diff = i * 86400 + (startSec - nowSec);

      if (!best || diff < best.diff) {
        best = { diff, schedule: s };
      }
    }
  }

  return best;
}

  const res = await fetch(url);

      <span style="font-weight:400;color:#6b7280;">

      </span>
    `;

  // 📦 kontener
  const el = document.getElementById("forecast");
  el.innerHTML = "";

  // 🌤 5 dni (co 8 wpisów = 24h)
  const daily = data.list.filter((_, i) => i % 8 === 0).slice(0, 5);

  daily.forEach(day => {
    const date = new Date(day.dt * 1000);
    const icon = day.weather[0].icon;
    const temp = Math.round(day.main.temp);
