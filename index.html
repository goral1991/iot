<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ESP32 Dashboard</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#1e1e1e;
  --muted:#6b7280;
  --primary:#4f46e5;
  --danger:#ef4444;
  --shadow: 0 10px 30px rgba(0,0,0,0.08);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  background:var(--bg);
  display:flex;
  justify-content:center;
  align-items:flex-start;
  min-height:100vh;
  padding:20px;
  color:var(--text);
}

.card{
  width:100%;
  max-width:420px;
  background:var(--card);
  border-radius:18px;
  box-shadow:var(--shadow);
  padding:22px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

h2{
  font-size:18px;
  margin:0;
}

.badge{
  font-size:12px;
  padding:6px 10px;
  border-radius:999px;
  background:#eef2ff;
}

button{
  width:100%;
  border:none;
  border-radius:14px;
  padding:14px;
  font-size:16px;
  cursor:pointer;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin-top:10px;
  transition:0.2s;
}

button:disabled{
  opacity:0.7;
  cursor:not-allowed;
}

.primary{
  background:var(--primary);
  color:white;
}

.danger{
  background:var(--danger);
  color:white;
}

.gray{
  background:#e5e7eb;
}

.status{
  margin-top:10px;
  font-size:13px;
  color:var(--muted);
}

.section{
  margin-top:18px;
  padding-top:16px;
  border-top:1px solid #eee;
}

input, select{
  width:100%;
  margin-top:8px;
  padding:10px;
  border-radius:10px;
  border:1px solid #ddd;
}

.small{
  font-size:12px;
  color:var(--muted);
}

/* DAYS */
.day{
  padding:10px;
  border-radius:10px;
  text-align:center;
  background:#f3f4f6;
  cursor:pointer;
  user-select:none;
  font-size:12px;
  transition:0.2s;
}

.day.active{
  background:var(--primary);
  color:white;
  transform:scale(1.05);
}

/* SPINNER */
.spinner{
  width:16px;
  height:16px;
  border:2px solid #fff;
  border-top:2px solid transparent;
  border-radius:50%;
  animation:spin 0.8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.statusBar{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}

.chip{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  padding:6px 10px;
  border-radius:999px;
  background:#eef2ff;
  white-space:nowrap;
}

.muted{
  color:#6b7280;
  font-size:11px;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#9ca3af;
}

.dot.online{
  background:#22c55e;
  box-shadow:0 0 8px #22c55e;
}


</style>
</head>

<body>

<div class="card">

  <div class="header">
    <h2>
      <i class="fa-solid fa-microchip"></i>
      ESP32
    </h2>

<div class="statusBar">

    <div class="chip" id="fwInfo">
      FW: ...
    </div>

    <div class="chip">
      <i class="fa-solid fa-signal" id="wifiIcon"></i>
      <span id="wifiText">...</span>
    </div>

    <div class="chip">
      <span class="dot" id="onlineDot"></span>
      <span></span>
      <span class="muted" id="lastSeenText">...</span>
    </div>

  </div>
  </div>

  <!-- VALVE -->
  <button id="btn" class="gray" onclick="toggleValve()">
    Ładowanie...
  </button>

  <div class="status" id="status">
    Łączenie...
  </div>



  <!-- SCHEDULE -->
  <div class="section">

    <h3 style="margin:0;font-size:14px;">
       <i class="fa-solid fa-calendar"></i> Harmonogram
    </h3>

    <div id="scheduleList" class="small">
      Ładowanie...
    </div>
<p>
<h3 style="margin:0;font-size:14px;">
       <i class="fa-regular fa-calendar"></i> Dodaj Harmonogram
    </h3>
	
    <!-- DAYS -->
    <div id="days"
         style="
         display:grid;
         grid-template-columns:repeat(4,1fr);
         gap:6px;
         margin-top:10px;
         ">

      <div class="day" data-day="1">Pn</div>
      <div class="day" data-day="2">Wt</div>
      <div class="day" data-day="3">Śr</div>
      <div class="day" data-day="4">Cz</div>
      <div class="day" data-day="5">Pt</div>
      <div class="day" data-day="6">So</div>
      <div class="day" data-day="0">Nd</div>
    </div>

    <!-- TIME -->
    <input id="time"
           type="time"
           style="margin-top:10px;">

    <!-- DURATION -->
    <input id="duration"
           type="number"
           placeholder="Czas (minuty)">

    <button class="primary"
            onclick="addSchedule()">

      Dodaj
    </button>

  </div>

  <!-- OTA -->
  <div class="section">

    <h3 style="margin:0;font-size:14px;">
      <i class="fa-solid fa-cloud-arrow-up"></i> OTA Update
    </h3>

    <input type="file" id="fw" accept=".bin"/>

    <button
      class="gray"
      id="uploadBtn"
      onclick="uploadOTA()">

      Upload firmware
    </button>

    <button
      class="danger"
      onclick="flashOTA()">

      Flash ESP32
    </button>

    <div class="status" id="otaStatus"></div>

    <!-- PROGRESS -->
    <div id="otaProgressWrap"
         style="display:none;margin-top:10px;">

      <div style="
        height:8px;
        background:#e5e7eb;
        border-radius:10px;
        overflow:hidden;
      ">
        <div id="otaProgressBar"
             style="
              height:100%;
              width:0%;
              background:var(--primary);
              transition:0.2s;
             ">
        </div>
      </div>

      <div class="small" id="otaProgressText">
        0%
      </div>
    </div>

  </div>
  
  
</div>

<script>

const API = "https://raspy-fire-23a7.piotrgorajewski.workers.dev";
const TOKEN = "MOJ_SUPER_TOKEN_123456";

let valveState = false;
let selectedDay = 1;

function rssiToPercent(rssi){

  if (rssi === undefined || rssi === null)
    return null;

  let percent = 2 * (rssi + 100);

  if (percent > 100) percent = 100;
  if (percent < 0) percent = 0;

  return Math.round(percent);
}


// ================= DAYS =================
document.addEventListener("DOMContentLoaded", () => {

  document.querySelectorAll(".day").forEach(el => {

    el.addEventListener("click", () => {

      document.querySelectorAll(".day")
        .forEach(d => d.classList.remove("active"));

      el.classList.add("active");

      selectedDay = Number(el.dataset.day);
    });
  });

  document
    .querySelector('.day[data-day="1"]')
    .classList.add("active");
});

// ================= TIME =================
function toUTC(hour, minute){

  const d = new Date();

  d.setHours(hour, minute, 0, 0);

  return {
    hour: d.getUTCHours(),
    minute: d.getUTCMinutes()
  };
}

function toPL(hour, minute){

  const d = new Date();

  d.setUTCHours(hour, minute, 0, 0);

  return {
    hour: d.getHours(),
    minute: d.getMinutes()
  };
}

// ================= STATE =================

async function fetchState(){

  try{

    const res = await fetch(API + "/api/state", {
      headers:{
        "Authorization":"Bearer " + TOKEN
      }
    });

    const data = await res.json();

    valveState = data.valve_state;

// FW
document.getElementById("fwInfo").innerText =
  "FW: " + (data.fw_version || "unknown");

// WIFI ICON + % z RSSI
const rssi = data.wifi_rssi;
const percent = rssiToPercent(rssi);

const wifiIcon = document.getElementById("wifiIcon");

// procent
document.getElementById("wifiText").innerText =
  percent !== null ? `${percent}%` : "n/a";

// ikona + kolor
wifiIcon.className = "fa-solid";

if (percent === null) {
  wifiIcon.classList.add("fa-signal-slash");
  wifiIcon.style.color = "#9ca3af";
}
else if (percent > 70) {
  wifiIcon.classList.add("fa-signal");
  wifiIcon.style.color = "#22c55e";
}
else if (percent > 40) {
  wifiIcon.classList.add("fa-signal");
  wifiIcon.style.color = "#f59e0b";
}
else {
  wifiIcon.classList.add("fa-signal-slash");
  wifiIcon.style.color = "#ef4444";
}


// ONLINE + last seen
const dot = document.getElementById("onlineDot");
const lastSeen = document.getElementById("lastSeenText");

function timeAgo(date){

  const now = new Date();
  const past = new Date(date);

  const diffSec = Math.floor((now - past) / 1000);

  if (diffSec < 60)
    return `${diffSec}s temu`;

  const diffMin = Math.floor(diffSec / 60);

  if (diffMin < 60)
    return `${diffMin} min temu`;

  const diffH = Math.floor(diffMin / 60);

  return `${diffH} h temu`;
}

const last = data.last_seen;

if (last) {

  const diffSec = Math.floor((Date.now() - new Date(last)) / 1000);

  if (diffSec <= 120) {

    // 🟢 ONLINE
    dot.classList.add("online");
    lastSeen.innerText = `online`;

  } else {

    // 🔴 OFFLINE + czas
    dot.classList.remove("online");
    lastSeen.innerText = `offline (${timeAgo(last)})`;
  }

} else {

  dot.classList.remove("online");
  lastSeen.innerText = `• offline`;
}

    updateUI();

  } catch(e){

    document.getElementById("status").innerText =
      "Brak połączenia";
  }
}

// ================= VALVE =================
async function toggleValve(){

  const res = await fetch(API + "/api/command", {
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      token:TOKEN,
      valve:!valveState
    })
  });

  const data = await res.json();

  valveState = data.valve_state;

  updateUI();
}

function updateUI(){

  const btn = document.getElementById("btn");

  btn.className = valveState
    ? "primary"
    : "gray";

  btn.innerText = valveState
    ? "Zawór ON"
    : "Zawór OFF";

  document.getElementById("status").innerText =
    valveState
      ? "Stan: OTWARTY"
      : "Stan: ZAMKNIĘTY";
}

// ================= OTA =================
function uploadOTA(){

  const file =
    document.getElementById("fw").files[0];

  if (!file)
    return alert("Wybierz plik");

  const form = new FormData();

  form.append("firmware", file);

  const btn =
    document.getElementById("uploadBtn");

  const status =
    document.getElementById("otaStatus");

  const wrap =
    document.getElementById("otaProgressWrap");

  const bar =
    document.getElementById("otaProgressBar");

  const text =
    document.getElementById("otaProgressText");

  // SHOW
  wrap.style.display = "block";

  bar.style.width = "0%";

  text.innerText = "0%";

  // BUTTON
  btn.disabled = true;

  btn.innerHTML = `
    <div class="spinner"></div>
    Uploading...
  `;

  status.innerText = "";

  const xhr = new XMLHttpRequest();

  xhr.open("POST", API + "/api/ota-upload");

  // PROGRESS
  xhr.upload.onprogress = (e) => {

    if(e.lengthComputable){

      const percent =
        Math.round((e.loaded / e.total) * 100);

      bar.style.width = percent + "%";

      text.innerText = percent + "%";
    }
  };

  // SUCCESS
  xhr.onload = () => {

    btn.disabled = false;

    btn.innerHTML = "Upload firmware";

    if(xhr.status === 200){

      status.innerText = "Upload OK";

      bar.style.width = "100%";

      text.innerText = "100%";

      // HIDE AFTER SUCCESS
      setTimeout(() => {

        wrap.style.display = "none";

        bar.style.width = "0%";

        text.innerText = "0%";

      }, 2000);

    }else{

      status.innerText = "Błąd uploadu";
    }
  };

  // ERROR
  xhr.onerror = () => {

    btn.disabled = false;

    btn.innerHTML = "Upload firmware";

    status.innerText = "Błąd połączenia";
  };

  xhr.send(form);
}

// ================= FLASH OTA =================
async function flashOTA(){

  await fetch(API + "/api/command", {
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      token:TOKEN,
      ota:true
    })
  });

  document.getElementById("otaStatus").innerText =
    "OTA STARTED";
}

// ================= SCHEDULE =================
async function loadSchedule(){

  const res =
    await fetch(API + "/api/schedule?token=" + TOKEN);

  const data =
    await res.json();

  const days = [
    "Niedziela",
    "Poniedziałek",
    "Wtorek",
    "Środa",
    "Czwartek",
    "Piątek",
    "Sobota"
  ];

  document.getElementById("scheduleList").innerHTML =

    data.length

    ? data.map(s => {

      const pl =
        toPL(s.start_hour, s.start_minute);

return `

<div style="
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:6px;
  padding:8px 10px;
  background:#f8fafc;
  border:1px solid #eef2f7;
  border-radius:10px;
">

  <div style="
    line-height:1.3;
  ">

    <div style="
      font-size:13px;
      font-weight:600;
    ">
      ${days[s.weekday]}
    </div>

    <div style="
      font-size:12px;
      color:#6b7280;
    ">

      ${String(pl.hour).padStart(2,'0')}
      :
      ${String(pl.minute).padStart(2,'0')}

      • ${Math.round(s.duration_sec / 60)} min

    </div>

  </div>

  <button
    class="danger"
    style="
      width:auto;
      padding:5px 8px;
      margin:0;
      border-radius:8px;
      font-size:11px;
    "
    onclick="deleteSchedule(${s.id})">

    <i class="fa fa-trash"></i>

  </button>

</div>

`;
    }).join("")

    : "Brak";
}

// ================= ADD SCHEDULE =================
async function addSchedule(){

  const time =
    document.getElementById("time").value;

  const durationMin =
    Number(document.getElementById("duration").value);

  if(!time)
    return alert("Wybierz godzinę");

  const [hour, minute] =
    time.split(":").map(Number);

  const utc =
    toUTC(hour, minute);

  await fetch(API + "/api/schedule", {

    method:"POST",

    headers:{
      "Content-Type":"application/json"
    },

    body:JSON.stringify({

      token:TOKEN,

      weekday:selectedDay,

      start_hour:utc.hour,

      start_minute:utc.minute,

      duration_sec:durationMin * 60
    })
  });

  loadSchedule();
}

// ================= DELETE SCHEDULE =================
async function deleteSchedule(id){

  const ok =
    confirm("Czy na pewno chcesz usunąć ten harmonogram?");

  if(!ok)
    return;

  const res =
    await fetch(API + "/api/schedule", {

      method:"DELETE",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        token:TOKEN,
        id:id
      })
    });

  const data =
    await res.json();

  if(!data.success){

    alert("Błąd usuwania");

    return;
  }

  loadSchedule();
}

// ================= INIT =================
fetchState();

loadSchedule();

setInterval(fetchState, 1000);

setInterval(loadSchedule, 1000);

</script>

</body>
</html>
