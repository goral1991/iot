<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 LED</title>

<style>

body{
  background:#111;
  color:white;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.box{
  text-align:center;
}

button{
  width:200px;
  height:60px;
  margin:10px;
  border:none;
  border-radius:12px;
  font-size:20px;
  cursor:pointer;
}

.on{
  background:#00c853;
  color:white;
}

.off{
  background:#d50000;
  color:white;
}

</style>
</head>
<body>

<div class="box">
  <h1>ESP32 LED</h1>

  <button class="on" onclick="setLed(true)">
    WŁĄCZ
  </button>

  <button class="off" onclick="setLed(false)">
    WYŁĄCZ
  </button>
</div>

<script>

const TOKEN = "MOJ_SUPER_TOKEN_123456";

async function setLed(state){

  await fetch("/api/command", {
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      token:TOKEN,
      led:state
    })
  });

}

</script>

</body>
</html>
