<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ESP32 Dashboard</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#1e1e1e;
  --muted:#6b7280;
  --primary:#4f46e5;
  --danger:#ef4444;
  --shadow: 0 10px 30px rgba(0,0,0,0.08);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  background:var(--bg);
  display:flex;
  justify-content:center;
  align-items:flex-start;
  min-height:100vh;
  padding:20px;
  color:var(--text);
}

/* ====== WRAPPER (tylko dodane) ====== */
.container{
  width:100%;
  max-width:420px;
  display:flex;
  flex-direction:column;
  gap:0;
}

/* ====== TWOJA ORYGINALNA KARTA (NIE ZMIENIONA) ====== */
.card{
  width:100%;
  background:var(--card);
  border-radius:18px;
  box-shadow:var(--shadow);
  padding:22px;
  margin-bottom:14px;
}

/* ====== HEADER (ORYGINAŁ) ====== */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

h2{
  font-size:18px;
  margin:0;
}

.badge{
  font-size:12px;
  padding:6px 10px;
  border-radius:999px;
  background:#eef2ff;
}

/* ====== BUTTONS (ORYGINAŁ) ====== */
button{
  width:100%;
  border:none;
  border-radius:14px;
  padding:14px;
  font-size:16px;
  cursor:pointer;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin-top:10px;
  transition:0.2s;
}

button:disabled{
  opacity:0.7;
  cursor:not-allowed;
}

.primary{
  background:var(--primary);
  color:white;
}

.danger{
  background:var(--danger);
  color:white;
}

.gray{
  background:#e5e7eb;
}

/* ====== STATUS (ORYGINAŁ) ====== */
.status{
  margin-top:10px;
  font-size:13px;
  color:var(--muted);
}

/* ====== SECTION ====== */
.section{
  margin-top:18px;
  padding-top:16px;
  border-top:1px solid #eee;
}

/* ====== INPUTS ====== */
input, select{
  width:100%;
  margin-top:8px;
  padding:10px;
  border-radius:10px;
  border:1px solid #ddd;
}

.small{
  font-size:12px;
  color:var(--muted);
}

/* ====== DAYS (ORYGINAŁ) ====== */
.day{
  padding:10px;
  border-radius:10px;
  text-align:center;
  background:#f3f4f6;
  cursor:pointer;
  user-select:none;
  font-size:12px;
  transition:0.2s;
}

.day.active{
  background:var(--primary);
  color:white;
  transform:scale(1.05);
}

/* ====== SPINNER ====== */
.spinner{
  width:16px;
  height:16px;
  border:2px solid #fff;
  border-top:2px solid transparent;
  border-radius:50%;
  animation:spin 0.8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.statusBar{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}

.chip{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  padding:6px 10px;
  border-radius:999px;
  background:#eef2ff;
  white-space:nowrap;
}

.muted{
  color:#6b7280;
  font-size:11px;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#9ca3af;
}

.dot.online{
  background:#22c55e;
  box-shadow:0 0 8px #22c55e;
}

.esp-title{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0;
  min-width:0;
}

/* kluczowe: blok pod tytułem */
.statusBar{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}

/* zabezpieczenie przed overflow */
.chip{
  max-width:100%;
}

.switch{
  position:relative;
  width:44px;
  height:24px;
  flex-shrink:0;
}

.switch input{
  display:none;
}

.slider{
  position:absolute;
  inset:0;
  background:#d1d5db;
  border-radius:999px;
  transition:0.2s;
  cursor:pointer;
}

.slider:before{
  content:"";
  position:absolute;
  width:18px;
  height:18px;
  left:3px;
  top:3px;
  background:white;
  border-radius:50%;
  transition:0.2s;
}

.switch input:checked + .slider{
  background:#22c55e;
}

.switch input:checked + .slider:before{
  transform:translateX(20px);
}

#zonesContainer{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:14px;
}

/* 📱 TELEFON */
@media (max-width: 700px){
  #zonesContainer{
    grid-template-columns: repeat(2, 1fr);
    gap:10px;
  }
}

@media (max-width: 700px){

  /* KAFELKI STREF */
  #zonesContainer .card{
    padding:14px;
    border-radius:14px;
  }

  /* tytuł sekcji */
  #zonesContainer h3{
    font-size:13px !important;
  }

  /* opis pod tytułem */
  #zonesContainer .small{
    font-size:11px;
  }

  /* status tekst */
  #zonesContainer .status{
    font-size:11px;
    line-height:1.3;
  }

  /* przycisk ON/OFF */
  #zonesContainer button{
    padding:10px;
    font-size:13px;
  }

  /* switch trochę mniejszy */
  .switch{
    width:40px;
    height:22px;
  }

  .slider:before{
    width:16px;
    height:16px;
  }

}

@media (max-width: 700px){
  #zonesContainer .card{
    margin-bottom:10px;
  }

  #zonesContainer h3{
    margin-bottom:4px;
  }

  .status{
    margin-top:6px;
  }
}

</style>
</head>

<body>

<div class="container">

  <!-- ================= SYSTEM ================= -->
  <div class="card">

<div class="header">

  <div style="min-width:0;">
    
    <h2 class="esp-title">
      <i class="fa-solid fa-microchip"></i>
      <span id="espName">ESP32 OGROD SZKLARNIA </span>
    </h2>

    <!-- POD TYTUŁEM -->
    <div class="statusBar" style="margin-top:8px;">

      <div class="chip" id="fwInfo">FW: ...</div>

      <div class="chip">
        <i class="fa-solid fa-wifi" id="wifiIcon"></i>
        <span id="wifiText">...</span>
      </div>

      <div class="chip">
        <span class="dot" id="onlineDot"></span>
        <span class="muted" id="lastSeenText">...</span>
      </div>

    </div>

  </div>

</div>

    <!-- OTA (bez zmian wizualnych) -->
    <div class="section">

      <h3 style="margin:0;font-size:14px;">
        <i class="fa-solid fa-cloud-arrow-up"></i> OTA Update
      </h3>

      <input type="file" id="fw" accept=".bin"/>

      <button class="gray" id="uploadBtn" onclick="uploadOTA()">
        Upload firmware
      </button>

      <button class="danger" onclick="flashOTA()">
        Flash ESP32
      </button>

      <div class="status" id="otaStatus"></div>

      <div id="otaProgressWrap" style="display:none;margin-top:10px;">
        <div style="height:8px;background:#e5e7eb;border-radius:10px;overflow:hidden;">
          <div id="otaProgressBar" style="height:100%;width:0%;background:var(--primary);"></div>
        </div>
        <div class="small" id="otaProgressText">0%</div>
      </div>

    </div>

  </div>

<!-- ================= STREFY ================= -->
<div id="zonesContainer"></div>



<!-- ================= HARMONOGRAM ================= -->
<div class="card">

  <!-- HEADER + RESET -->
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">

    <h3 style="margin:0;font-size:14px;">
      <i class="fa-solid fa-calendar"></i> Harmonogram
    </h3>

    <button
      class="danger"
      style="width:auto;padding:6px 10px;font-size:12px;margin:0;border-radius:8px;"
      onclick="clearAllSchedules()"
    >
      Usuń wszystko
    </button>

  </div>

  <!-- LISTA -->
  <div id="scheduleList" class="small">Ładowanie...</div>

  <div class="section">

    <h3 style="margin:0;font-size:14px;">
      Dodaj Harmonogram
    </h3>

    <!-- STREFY -->
    <select
      id="zoneSelect"
      style="
        margin-top:10px;
        padding:10px;
        border-radius:10px;
        border:1px solid #ddd;
      ">
    </select>

    <!-- DNI -->
    <div id="days"
         style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;">

      <div class="day" data-day="1">Pn</div>
      <div class="day" data-day="2">Wt</div>
      <div class="day" data-day="3">Śr</div>
      <div class="day" data-day="4">Cz</div>
      <div class="day" data-day="5">Pt</div>
      <div class="day" data-day="6">So</div>
      <div class="day" data-day="0">Nd</div>

    </div>

    <!-- GODZINA -->
    <input id="time" type="time">

    <!-- CZAS -->
    <input id="duration" type="number" placeholder="Czas (minuty)">

    <!-- DODAJ -->
    <button class="primary" onclick="addSchedule()">
      Dodaj
    </button>

  </div>

</div>

</div>


<script>

const API = "https://raspy-fire-23a7.piotrgorajewski.workers.dev";
const TOKEN = "MOJ_SUPER_TOKEN_123456";

let zones = [];
let zonesList = [];
let selectedDays = [];
let zoneMap = {};
let allSchedules = [];


function rssiToPercent(rssi){

  if (rssi === undefined || rssi === null)
    return null;

  let percent = 2 * (rssi + 100);

  if (percent > 100) percent = 100;
  if (percent < 0) percent = 0;

  return Math.round(percent);
}


// ================= DAYS =================
document.addEventListener("DOMContentLoaded", () => {

  document.querySelectorAll(".day").forEach(el => {

    el.addEventListener("click", () => {

      const day = Number(el.dataset.day);

      if (selectedDays.includes(day)) {
        selectedDays = selectedDays.filter(d => d !== day);
        el.classList.remove("active");
      } else {
        selectedDays.push(day);
        el.classList.add("active");
      }

    });

  });

});

// ================= TIME =================
function toUTC(hour, minute){

  const d = new Date();

  d.setHours(hour, minute, 0, 0);

  return {
    hour: d.getUTCHours(),
    minute: d.getUTCMinutes()
  };
}

function toPL(hour, minute){

  const d = new Date();

  d.setUTCHours(hour, minute, 0, 0);

  return {
    hour: d.getHours(),
    minute: d.getMinutes()
  };
}

// ================= STATE =================

async function fetchState() {

  try {

    const res = await fetch(API + "/api/state", {
      headers: {
        "Authorization": "Bearer " + TOKEN
      }
    });

    const data = await res.json();

    zones = data.zones || [];

    // ================= FW =================
    document.getElementById("fwInfo").innerText =
      "FW: " + (data.fw_version || "unknown");

    // ================= ONLINE STATUS =================
    const dot = document.getElementById("onlineDot");
    const lastSeen = document.getElementById("lastSeenText");

    function timeAgo(date) {

      const now = new Date();
      const past = new Date(date);

      const diffSec = Math.floor((now - past) / 1000);

      if (diffSec < 60) return `${diffSec}s temu`;

      const diffMin = Math.floor(diffSec / 60);

      if (diffMin < 60) return `${diffMin} min temu`;

      const diffH = Math.floor(diffMin / 60);

      return `${diffH} h temu`;
    }

    const last = data.last_seen;

    let isOnline = false;

    if (last) {

      const diffSec = Math.floor((Date.now() - new Date(last)) / 1000);
      isOnline = diffSec <= 120;

      if (isOnline) {

        dot.classList.add("online");
        lastSeen.innerText = "online";

      } else {

        dot.classList.remove("online");
        lastSeen.innerText = `offline (${timeAgo(last)})`;
      }

    } else {

      dot.classList.remove("online");
      lastSeen.innerText = "• offline";
    }

    // ================= WIFI =================
const wifiIcon = document.getElementById("wifiIcon");
const wifiText = document.getElementById("wifiText");

let percent = null;

if (isOnline) {
  percent = rssiToPercent(data.wifi_rssi);
}

// OFFLINE
if (!isOnline) {

  wifiText.innerText = "n/a";

  wifiIcon.className = "fa-solid fa-wifi";
  wifiIcon.style.color = "#6b7280";
  wifiIcon.style.opacity = "0.4";
}

// ONLINE brak RSSI
else if (percent === null) {

  wifiText.innerText = "n/a";

  wifiIcon.className = "fa-solid fa-wifi";
  wifiIcon.style.color = "#9ca3af";
  wifiIcon.style.opacity = "0.6";
}

// ONLINE OK
else {

  wifiText.innerText = `${percent}%`;

  wifiIcon.className = "fa-solid fa-wifi";
  wifiIcon.style.opacity = "1";

  if (percent > 70) {
    wifiIcon.style.color = "#22c55e";
  } else if (percent > 40) {
    wifiIcon.style.color = "#f59e0b";
  } else {
    wifiIcon.style.color = "#ef4444";
  }
}

    // ================= UI =================
    updateUI();

  } catch (e) {

    document.getElementById("status").innerText =
      "Brak połączenia";
  }
}

// ================= VALVE =================
async function toggleValve(zone, valve){

  await fetch(API + "/api/command", {

    method:"POST",

    headers:{
      "Content-Type":"application/json"
    },

    body:JSON.stringify({
      token:TOKEN,
      zone:zone,
      valve:valve
    })
  });

  await fetchState();
}

// ================= VALVE =================
async function toggleZoneEnabled(zone, enabled){

  await fetch(API + "/api/command", {

    method:"POST",

    headers:{
      "Content-Type":"application/json"
    },

    body:JSON.stringify({
      token:TOKEN,
      zone:zone,
      enabled:enabled
    })
  });

  await fetchState();
}

// ================= UPDATE UI =================
function updateUI() {

  const container =
    document.getElementById("zonesContainer");

  container.innerHTML = zones.map(z => {

    const isEnabled = z.enabled;
    const valveOn = isEnabled && z.valve_state;

    const title =
      `SEKCJA ${z.zone}${z.name ? ` (${z.name})` : ""}`;

    // ================= NEXT WATERING =================
    const next = getNextWateringForZone(allSchedules, z.zone);

    let nextText = "Brak";

    if (next) {

      const date = new Date(Date.now() + next.diff * 1000);

      const days = ["Nd","Pn","Wt","Śr","Cz","Pt","So"];

      const hh = String(date.getHours()).padStart(2,'0');
const mm = String(date.getMinutes()).padStart(2,'0');

     nextText = `${days[date.getDay()]} ${hh}:${mm}`;
    }

    return `
      <div class="card"
        style="
          opacity:${isEnabled ? '1' : '0.55'};
        "
      >

        <div style="
          display:flex;
          justify-content:space-between;
          align-items:flex-start;
          gap:12px;
        ">

          <div>

            <h3 style="
              margin:0;
              font-size:14px;
            ">
              <i class="fa-solid fa-droplet"></i>
              ${title}
            </h3>

            <div class="small">
              ${
                isEnabled
                  ? 'Sekcja aktywna'
                  : 'Sekcja wyłączona'
              }
            </div>

          </div>

          <!-- ENABLE / DISABLE -->
          <label class="switch">

            <input
              type="checkbox"
              ${isEnabled ? 'checked' : ''}

              onchange="
                toggleZoneEnabled(
                  ${z.zone},
                  this.checked
                )
              "
            >

            <span class="slider"></span>

          </label>

        </div>

        <!-- VALVE -->
        <button
          class="${valveOn ? 'primary' : 'gray'}"
          ${!isEnabled ? 'disabled' : ''}
          onclick="
            toggleValve(
              ${z.zone},
              ${!valveOn}
            )
          "
        >
          ${valveOn ? 'Zawór ON' : 'Zawór OFF'}
        </button>

        <!-- STATUS + NEXT WATERING -->
        <div class="status">
          ${
            !isEnabled
              ? 'Sekcja wyłączona z systemu'
              : valveOn
                ? 'Stan: OTWARTY'
                : 'Stan: ZAMKNIĘTY'
          }
          <br>
<span style="font-size:11px;opacity:0.75;">
  Następne podlewanie:
  <span style="font-weight:700;">
    ${nextText}
  </span>
</span>
        </div>

      </div>
    `;
  }).join("");
}

// ================= OTA =================
function uploadOTA(){

  const file =
    document.getElementById("fw").files[0];

  if (!file)
    return alert("Wybierz plik");

  const form = new FormData();

  form.append("firmware", file);

  const btn =
    document.getElementById("uploadBtn");

  const status =
    document.getElementById("otaStatus");

  const wrap =
    document.getElementById("otaProgressWrap");

  const bar =
    document.getElementById("otaProgressBar");

  const text =
    document.getElementById("otaProgressText");

  // SHOW
  wrap.style.display = "block";

  bar.style.width = "0%";

  text.innerText = "0%";

  // BUTTON
  btn.disabled = true;

  btn.innerHTML = `
    <div class="spinner"></div>
    Uploading...
  `;

  status.innerText = "";

  const xhr = new XMLHttpRequest();

  xhr.open("POST", API + "/api/ota-upload");

  // PROGRESS
  xhr.upload.onprogress = (e) => {

    if(e.lengthComputable){

      const percent =
        Math.round((e.loaded / e.total) * 100);

      bar.style.width = percent + "%";

      text.innerText = percent + "%";
    }
  };

  // SUCCESS
  xhr.onload = () => {

    btn.disabled = false;

    btn.innerHTML = "Upload firmware";

    if(xhr.status === 200){

      status.innerText = "Upload OK";

      bar.style.width = "100%";

      text.innerText = "100%";

      // HIDE AFTER SUCCESS
      setTimeout(() => {

        wrap.style.display = "none";

        bar.style.width = "0%";

        text.innerText = "0%";

      }, 2000);

    }else{

      status.innerText = "Błąd uploadu";
    }
  };

  // ERROR
  xhr.onerror = () => {

    btn.disabled = false;

    btn.innerHTML = "Upload firmware";

    status.innerText = "Błąd połączenia";
  };

  xhr.send(form);
}

// ================= FLASH OTA =================
async function flashOTA(){

  await fetch(API + "/api/command", {
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      token:TOKEN,
      ota:true
    })
  });

  document.getElementById("otaStatus").innerText =
    "OTA STARTED";
}


async function loadSchedule() {

  const res =
    await fetch(API + "/api/schedule?token=" + TOKEN);

  const data =
    await res.json();

  // 🔥 CACHE GLOBALNY (DO updateUI -> next watering per zone)
  allSchedules = data;

  const days = [
    "Niedziela",
    "Poniedziałek",
    "Wtorek",
    "Środa",
    "Czwartek",
    "Piątek",
    "Sobota"
  ];

  document.getElementById("scheduleList").innerHTML =

    data.length

    ? data.map(s => {

        const pl = toPL(s.start_hour, s.start_minute);

        const zoneName =
          zoneMap && zoneMap[s.zone_index]
            ? zoneMap[s.zone_index]
            : `Sekcja ${s.zone_index}`;

        const zoneColor =
          getZoneColor
            ? getZoneColor(s.zone_index)
            : "#6b7280";

        return `

<div style="
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:6px;
  padding:8px 10px;
  background:#f8fafc;
  border:1px solid #eef2f7;
  border-radius:10px;
">

  <div style="line-height:1.3;">

    <!-- DZIEŃ + BADGE -->
    <div style="display:flex;align-items:center;gap:8px;">

      <!-- DZIEŃ -->
      <div style="
        font-size:13px;
        font-weight:600;
      ">
        ${days[s.weekday]}
      </div>

      <!-- BADGE STREFY -->
      <div style="
        font-size:11px;
        padding:3px 8px;
        border-radius:999px;
        color:white;
        background:${zoneColor};
        white-space:nowrap;
      ">
        ${zoneName}
      </div>

    </div>

    <!-- GODZINA + CZAS -->
    <div style="
      font-size:12px;
      color:#6b7280;
      margin-top:3px;
    ">

      ${String(pl.hour).padStart(2,'0')}
      :
      ${String(pl.minute).padStart(2,'0')}

      • ${Math.round(s.duration_sec / 60)} min

    </div>

  </div>

  <!-- DELETE -->
  <button
    class="danger"
    style="
      width:auto;
      padding:5px 8px;
      margin:0;
      border-radius:8px;
      font-size:11px;
    "
    onclick="deleteSchedule(${s.id})">

    <i class="fa fa-trash"></i>

  </button>

</div>

`;

      }).join("")

    : "Brak";
}

// ================= LOAD LIST =================
async function loadZonesList() {
  const res = await fetch(API + "/api/state", {
    headers: {
      "Authorization": "Bearer " + TOKEN
    }
  });

  const data = await res.json();

  zonesList = data.zones || [];

  const select = document.getElementById("zoneSelect");

  select.innerHTML = zonesList.map(z => `
    <option value="${z.zone}">
      Sekcja ${z.zone}${z.name ? ` (${z.name})` : ""}
    </option>
  `).join("");
}

// ================= LOAD MAP =================
zoneMap = {};

zonesList.forEach(z => {
  zoneMap[z.zone] = z.name || `Sekcja ${z.zone}`;
});

// ================= KOLORY STREF =================
function getZoneColor(zone) {

  const colors = [
    "#22c55e", // 1
    "#3b82f6", // 2
    "#f59e0b", // 3
    "#ef4444", // 4
    "#a855f7", // 5
    "#06b6d4", // 6
    "#84cc16", // 7
    "#f97316"  // 8
  ];

  return colors[(zone - 1) % colors.length] || "#6b7280";
}

// ================= LOAD LIST =================
function renderZoneSelect() {

  const select = document.getElementById("zoneSelect");

  select.innerHTML = zonesList.map(z => `
    <option value="${z.zone}">
      Sekcja ${z.zone}${z.name ? ` (${z.name})` : ""}
    </option>
  `).join("");
}

// ================= ADD SCHEDULE =================
async function addSchedule() {

  const time = document.getElementById("time").value;
  const durationMin = Number(document.getElementById("duration").value);
  const zone = Number(document.getElementById("zoneSelect").value);

  if (!time) return alert("Wybierz godzinę");
  if (!durationMin) return alert("Podaj czas");
  if (selectedDays.length === 0) return alert("Wybierz dni");

  const [hour, minute] = time.split(":").map(Number);
  const utc = toUTC(hour, minute);

  const requests = selectedDays.map(day => {

    return fetch(API + "/api/schedule", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        token: TOKEN,
        weekday: day,
        start_hour: utc.hour,
        start_minute: utc.minute,
        duration_sec: durationMin * 60,
        zone_index: zone
      })
    });

  });

  await Promise.all(requests);

  // reset UI
  selectedDays = [];
  document.querySelectorAll(".day")
    .forEach(d => d.classList.remove("active"));

  document.getElementById("time").value = "";
  document.getElementById("duration").value = "";

  loadSchedule();
}

// ================= DELETE SCHEDULE =================
async function deleteSchedule(id){

  const ok =
    confirm("Czy na pewno chcesz usunąć ten harmonogram?");

  if(!ok)
    return;

  const res =
    await fetch(API + "/api/schedule", {

      method:"DELETE",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        token:TOKEN,
        id:id
      })
    });

  const data =
    await res.json();

  if(!data.success){

    alert("Błąd usuwania");

    return;
  }

  loadSchedule();
}

// ================= DELETE ALL SCHEDULE =================
async function clearAllSchedules() {
  const ok = confirm("Usunąć cały harmonogram?");
  if (!ok) return;

  await fetch(API + "/api/schedule/clear", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ token: TOKEN })
  });

  loadSchedule();
}


// ================= NASTEPNE PODLEWANIE =================
function getNextWateringForZone(schedules, zoneIndex) {

  const now = new Date();

  const nowDay = now.getDay(); // NIE UTC

  const nowSec =
    now.getUTCHours() * 3600 +
    now.getUTCMinutes() * 60 +
    now.getUTCSeconds();

  let best = null;

  for (const s of schedules) {

    if (!s.enabled) continue;
    if (Number(s.zone_index) !== Number(zoneIndex)) continue;

    for (let i = 0; i <= 7; i++) {

        const day = (nowDay + i) % 7;

      if (Number(s.weekday) !== day) continue;

      const startSec =
        Number(s.start_hour) * 3600 +
        Number(s.start_minute) * 60;

      if (i === 0 && startSec <= nowSec) continue;

      const diff = i * 86400 + (startSec - nowSec);

      if (!best || diff < best.diff) {
        best = { diff, schedule: s };
      }
    }
  }

  return best;
}
